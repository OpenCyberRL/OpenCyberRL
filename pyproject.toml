[project]
name = "opencrl"
version = "0.1.0"
description = "Plug-and-play cybersecurity RL task-building framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
gym = ["gymnasium>=0.29"]

[project.scripts]
opencrl = "opencrl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencrl"]

[tool.pytest.ini_options]
addopts = "-m 'not docker and not qemu' --import-mode=importlib"
markers = [
    "docker: integration tests that require Docker (deselected by default)",
    "qemu: integration tests that require QEMU (deselected by default)",
]

[dependency-groups]
dev = ["pytest>=8"]
